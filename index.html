<!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مجهر | MIJHAR_</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #dfc9a8;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 16px;
      }

      .card {
        width: 100%;
        max-width: 380px;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 30px;
        padding: 40px 24px;
        text-align: center;
      }

      .header { margin-bottom: 36px; }

      .logo {
        width: 220px;
        object-fit: contain;
        margin: 0 auto 20px;
        display: block;
        filter: drop-shadow(0 4px 12px rgba(93,64,55,0.15));
      }

      .description { font-size: 1rem; color: #8d6e63; }

      .links-wrapper { position: relative; }

      .profile-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: bottom;
        opacity: 0.13;
        pointer-events: none;
        user-select: none;
      }

      .links {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .link-card {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #ffffff;
        color: #5d4037;
        text-decoration: none;
        padding: 16px 20px;
        border-radius: 16px;
        border: 1px solid #d7ccc8;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      .link-card:hover {
        background-color: #6d4c41;
        border-color: #6d4c41;
        color: #ffffff;
        transform: translateY(-4px);
        box-shadow: 0 8px 15px rgba(93,64,55,0.25);
      }

      .link-card i { font-size: 1.2rem; flex-shrink: 0; }
    </style>
  </head>
